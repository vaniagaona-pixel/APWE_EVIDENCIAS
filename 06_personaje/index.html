<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personaje</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <section class="escena">

        <section class="personaje">

            <div class="antena antena_izquierda">
                <span class="puntito p1"></span>
                <span class="puntito p2"></span>
                <span class="puntito p3"></span>
                <span class="puntito p4"></span>
            </div>

            <div class="antena antena_derecha">
                <span class="puntito p1"></span>
                <span class="puntito p2"></span>
                <span class="puntito p3"></span>
            </div>

            <div class="mechon mechon_uno"></div>
            <div class="mechon mechon_dos"></div>
            <div class="mechon mechon_tres"></div>

            <div class="cabeza"></div>

            <section class="ojos">
                <div class="ojo"></div>
                <div class="ojo"></div>
            </section>

            <div class="nariz"></div>
            <div class="boca"></div>

            <section class="playera">
                <div class="brazo brazo_izquierdo"></div>
                <div class="brazo brazo_derecho"></div>
            </section>

            <div class="panza"></div>

            <div class="pierna pierna_izquierda">
                <div class="pie"></div>
            </div>

            <div class="pierna pierna_derecha">
                <div class="pie"></div>
            </div>

        </section>

    </section>

</body>
</html>
